<svg xmlns="http://www.w3.org/2000/svg" width="800" height="710" viewBox="0 0 800 710" role="img" aria-labelledby="title desc">
<title id="title">Raqmi application authorization boundary</title><desc id="desc">Model proposal passes whitelist, strict validation and identity canonicalization, then application authorization. Denied calls do not execute; allowed calls execute and log their result.</desc>
<defs><radialGradient id="glow" cx="90%" cy="0%" r="90%"><stop stop-color="#14364D"/><stop offset="1" stop-color="#080F1D"/></radialGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#A5D9FF" stroke-opacity=".045"/></pattern></defs>
<rect width="800" height="710" rx="28" fill="url(#glow)"/><rect width="800" height="710" rx="28" fill="url(#grid)"/><rect x="1" y="1" width="798" height="708" rx="27" fill="none" stroke="#263A50"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="48" y="64" fill="#69DFFF" font-size="30" font-weight="700" >THE ACTION BOUNDARY</text><rect x="48" y="102" width="704" height="103" rx="18" fill="#101E31" stroke="#263A50"/><text x="72" y="144" fill="#F4F8FF" font-size="33" font-weight="600" >1. Model requests a tool</text><text x="72" y="181" fill="#B3C4D7" font-size="26" font-weight="400" >A proposal, never a permission grant.</text><path d="M400 205V229" stroke="#69DFFF" stroke-width="2"/><rect x="48" y="229" width="704" height="103" rx="18" fill="#101E31" stroke="#263A50"/><text x="72" y="271" fill="#F4F8FF" font-size="33" font-weight="600" >2. Validate the request</text><text x="72" y="308" fill="#B3C4D7" font-size="26" font-weight="400" >Whitelist, strict schema, canonical identity.</text><path d="M400 332V356" stroke="#69DFFF" stroke-width="2"/><rect x="48" y="356" width="704" height="103" rx="18" fill="#101E31" stroke="#263A50"/><text x="72" y="398" fill="#F4F8FF" font-size="33" font-weight="600" >3. Authorize in application code</text><text x="72" y="435" fill="#B3C4D7" font-size="26" font-weight="400" >Session ownership + operation consent.</text><path d="M400 459V482H214V508M400 482H586V508" stroke="#69DFFF" stroke-width="2" fill="none"/><rect x="48" y="508" width="332" height="106" rx="18" fill="#101E31" stroke="#263A50"/><text x="72" y="550" fill="#B3C4D7" font-size="27" font-weight="700" >DENIED</text><text x="72" y="589" fill="#F4F8FF" font-size="30" font-weight="400" >No execution</text><rect x="420" y="508" width="332" height="106" rx="18" fill="#101E31" stroke="#263A50"/><text x="444" y="550" fill="#87E7B3" font-size="27" font-weight="700" >ALLOWED</text><text x="444" y="589" fill="#F4F8FF" font-size="30" font-weight="400" >Execute + log</text><text x="48" y="668" fill="#B3C4D7" font-size="29" font-weight="400" >Return a verified result or a safe refusal.</text></g></svg>
